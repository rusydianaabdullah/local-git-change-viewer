services:
  gitviewer:
    build: .
    container_name: ${CONTAINER_NAME:-git-change-viewer}
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${PORT:-8005}:8005"
    volumes:
      # Mounted at the same path so folder paths in settings match the host.
      # Read-write so fetch/pull can update repos.
      - ${ALLOW_ROOT:?set ALLOW_ROOT in .env}:${ALLOW_ROOT}
      # Host git identity + stored HTTPS credentials for fetch/pull.
      - ${GIT_CONFIG:-${HOME}/.gitconfig}:/gitHome/.gitconfig:ro
      - ${GIT_CREDENTIALS:-${HOME}/.git-credentials}:/gitHome/.git-credentials:ro
    environment:
      - PROJECTS_DIR=${PROJECTS_DIR:-${ALLOW_ROOT}}
      - ALLOW_ROOT=${ALLOW_ROOT}
      - HOME=/gitHome
